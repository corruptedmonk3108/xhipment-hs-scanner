name: Refresh Quote Lookup

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest quote lookup data
        run: python scripts/fetch_quote_lookup.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add quote_lookup.json
          if git diff --cached --quiet; then
            echo "No changes to quote_lookup.json — skipping commit."
          else
            git commit -m "chore: refresh quote_lookup.json [skip ci]"
            git push origin main
          fi
